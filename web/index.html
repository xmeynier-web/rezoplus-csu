<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSU - Rezo+ Patrol</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />

    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1d2430;
        --text: #e6edf3;
        --muted: #8b949e;
        --line: rgba(255,255,255,0.08);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      body {
        overflow: hidden;
      }

      .app {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      .sidebar {
        width: 420px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 18px 18px 10px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header h1 {
        margin: 0;
        font-size: 2rem;
      }

      .badge {
        background: rgba(47,129,247,0.18);
        border: 1px solid rgba(47,129,247,0.4);
        border-radius: 999px;
        padding: 6px 10px;
        color: #cfe3ff;
        font-size: 11px;
      }

      .panel {
        padding: 12px 12px 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .panel h3 {
        margin: 0 0 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 13px;
      }

      .unit-list, .courante-list {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .unit-card {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }

      .unit-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .unit-name {
        font-size: 16px;
        font-weight: 700;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        color: white;
        white-space: nowrap;
      }

      .gps-line {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }

      .mission-box {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
        line-height: 1.6;
      }

      .courante-item {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
      }

      .courante-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }

      .courante-author {
        font-weight: 700;
      }

      .courante-text {
        color: #dfe7ef;
        font-size: 12px;
        line-height: 1.5;
      }

      .map-panel {
        flex: 1;
        position: relative;
        background: #0b1220;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      .custom-pin-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid white;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.12);
      }

      @media (max-width: 1000px) {
        .app {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          max-height: 48vh;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .map-panel {
          height: 52vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="header">
          <h1>CSU</h1>
          <div class="badge">Rezo+ Patrol</div>
        </div>

        <div class="panel">
          <h3>Unités actives</h3>
          <div id="unit-list" class="unit-list"></div>
        </div>

        <div class="panel" style="padding-bottom: 12px;">
          <h3>Main courante</h3>
          <div id="main-courante-list" class="courante-list"></div>
        </div>
      </aside>

      <main class="map-panel">
        <div id="map"></div>
      </main>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getDatabase,
        ref,
        onValue
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCu0BK4h2hhaGV4C46C9y65rBJlnLftq3A",
        authDomain: "rezoplus-police.firebaseapp.com",
        databaseURL: "https://rezoplus-police-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "rezoplus-police",
        storageBucket: "rezoplus-police.firebasestorage.app",
        messagingSenderId: "561209004165",
        appId: "1:561209004165:web:4c19c7b505bf7ad7df19ec"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const unitsRef = ref(db, "units");
      const mainCouranteRef = ref(db, "mains_courantes");

      const map = L.map("map").setView([48.755578, 2.321367], 12);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);

      const unitMarkers = new Map();
      const unitCards = new Map();

      function clampColor(value) {
        return (value || "#777777").trim();
      }

      function hexToRgba(hex, alpha = 1) {
        const clean = clampColor(hex).replace("#", "");
        const full = clean.length === 3
          ? clean.split("").map(c => c + c).join("")
          : clean;

        if (!/^[0-9a-fA-F]{6}$/.test(full)) {
          return `rgba(119, 119, 119, ${alpha})`;
        }

        const num = parseInt(full, 16);
        const r = (num >> 16) & 255;
        const g = (num >> 8) & 255;
        const b = num & 255;

        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function renderStatusBadge(label, color) {
        return `
          <span class="status-pill" style="background:${clampColor(color)};">
            ${label || "INCONNU"}
          </span>
        `;
      }

      function renderMissionBlock(data) {
        const missionStatus = data.mission_status || "AUCUN";
        const missionFeedback = data.mission_feedback || "Aucune information";
        const activeMission = data.active_mission || null;

        if (!activeMission) {
          return `
            <div class="mission-box">
              <div><strong>Mission :</strong> ${missionStatus}</div>
              <div><strong>Retour CSU :</strong> ${missionFeedback}</div>
            </div>
          `;
        }

        const title = activeMission.title || activeMission.titre || "Intervention";
        const location = activeMission.location || activeMission.adresse || "Non précisé";

        return `
          <div class="mission-box">
            <div><strong>Objet :</strong> ${title}</div>
            <div><strong>Lieu :</strong> ${location}</div>
            <div><strong>Mission :</strong> ${missionStatus}</div>
            <div><strong>Retour CSU :</strong> ${missionFeedback}</div>
          </div>
        `;
      }

      function renderUnitCard(unitId, data) {
        const statusLabel = data.statusLabel || data.status || "INCONNU";
        const statusColor = data.statusColor || "#777777";
        const lat = Number(data.latitude);
        const lng = Number(data.longitude);

        return `
          <div class="unit-card">
            <div class="unit-header">
              <div class="unit-name">${unitId}</div>
              ${renderStatusBadge(statusLabel, statusColor)}
            </div>

            <div class="gps-line">
              GPS :
              ${Number.isFinite(lat) && Number.isFinite(lng)
                ? `${lat.toFixed(5)} / ${lng.toFixed(5)}`
                : "non disponible"}
            </div>

            ${renderMissionBlock(data)}
          </div>
        `;
      }

      function updateMarker(unitId, data) {
        const lat = Number(data.latitude);
        const lng = Number(data.longitude);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
          if (unitMarkers.has(unitId)) {
            map.removeLayer(unitMarkers.get(unitId));
            unitMarkers.delete(unitId);
          }
          return;
        }

        const statusColor = clampColor(data.statusColor || "#777777");

        const markerIcon = L.divIcon({
          className: "custom-pin",
          html: `<div class="custom-pin-dot" style="background:${statusColor}; box-shadow:0 0 0 2px ${hexToRgba(statusColor, 0.35)};"></div>`,
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });

        if (unitMarkers.has(unitId)) {
          const marker = unitMarkers.get(unitId);
          marker.setIcon(markerIcon);
          marker.setLatLng([lat, lng]);
          marker.setPopupContent(`
            <div>
              <strong>${unitId}</strong><br>
              ${data.statusLabel || data.status || "INCONNU"}<br>
              ${lat.toFixed(5)} / ${lng.toFixed(5)}
            </div>
          `);
        } else {
          const marker = L.marker([lat, lng], { icon: markerIcon }).addTo(map);
          marker.bindPopup(`
            <div>
              <strong>${unitId}</strong><br>
              ${data.statusLabel || data.status || "INCONNU"}<br>
              ${lat.toFixed(5)} / ${lng.toFixed(5)}
            </div>
          `);
          unitMarkers.set(unitId, marker);
        }
      }

      function refreshUnits(units) {
        const list = document.getElementById("unit-list");
        list.innerHTML = "";

        const unitIds = Object.keys(units).sort();

        for (const unitId of unitIds) {
          const data = units[unitId] || {};
          const card = document.createElement("div");
          card.innerHTML = renderUnitCard(unitId, data);
          list.appendChild(card.firstElementChild);

          unitCards.set(unitId, card.firstElementChild);
          updateMarker(unitId, data);
        }

        for (const unitId of [...unitCards.keys()]) {
          if (!units[unitId]) {
            const node = unitCards.get(unitId);
            if (node) node.remove();
            unitCards.delete(unitId);
          }
        }

        for (const unitId of [...unitMarkers.keys()]) {
          if (!units[unitId]) {
            map.removeLayer(unitMarkers.get(unitId));
            unitMarkers.delete(unitId);
          }
        }
      }

      function renderMainCourante(entries) {
        const list = document.getElementById("main-courante-list");
        list.innerHTML = "";

        const values = Object.values(entries || {});
        values
          .slice()
          .reverse()
          .forEach((item) => {
            const message = item.message || "Sans message";
            const author = item.author || "Inconnu";
            const color = item.statusColor || "#777777";
            const timestamp = item.timestamp || Date.now();

            const row = document.createElement("div");
            row.className = "courante-item";

            row.innerHTML = `
              <div class="courante-head">
                <div class="courante-author">${author}</div>
                <span class="status-pill" style="background:${color}; font-size:10px; padding:4px 8px;">
                  ${new Date(timestamp).toLocaleTimeString("fr-FR")}
                </span>
              </div>
              <div class="courante-text">${message}</div>
            `;

            list.appendChild(row);
          });
      }

      onValue(unitsRef, (snapshot) => {
        const units = snapshot.val() || {};
        refreshUnits(units);
      });

      onValue(mainCouranteRef, (snapshot) => {
        const items = snapshot.val() || {};
        renderMainCourante(items);
      });
    </script>
  </body>
</html>

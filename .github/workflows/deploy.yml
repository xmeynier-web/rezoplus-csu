name: Deploy Web CSU to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create fresh Flutter project
        run: |
          mkdir -p temp_backup/lib
          cp lib/main.dart temp_backup/lib/ || true
          cp pubspec.yaml temp_backup/ || true
          
          rm -rf lib android ios web linux macos windows pubspec.yaml
          
          flutter create . --org com.rezoplus --project-name rezoplus_csu --platforms=web
          
          cp temp_backup/lib/main.dart lib/main.dart
          cp temp_backup/pubspec.yaml pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/rezoplus-csu/"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
